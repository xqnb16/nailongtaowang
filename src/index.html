<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雨蚀神殿</title><link rel="stylesheet" href="style.css"></head>
<body><main id="screen"><canvas id="view" aria-label="第一人称神殿场景"></canvas><div id="grade"></div>
<section id="intro" class="overlay"><header><span class="mark">◇</span> <span>雨蚀神殿<br><small>THE RAINWORN TEMPLE</small></span><button class="settings" id="settings" title="设置">设置</button></header>
<div class="intro-copy"><div class="eyebrow"><i></i> 第一人称遗迹逃亡</div><h1>雨蚀神殿</h1><p class="subtitle">THE RAINWORN TEMPLE</p><p class="brief">奶龙从遗迹深处追了出来。<br>冲出神殿，沿着金币穿过没有尽头的雨林。</p><button class="primary" id="start" disabled>正在加载场景</button><p id="load-error" role="status"></p></div>
<footer><span class="mobile-only">左右滑换道 · 上滑跳跃 · 下滑下蹲</span><span class="desktop-only"><kbd>A / D</kbd> 横移</span><span class="desktop-only"><kbd>Q / E</kbd> 转弯</span><span class="desktop-only"><kbd>空格</kbd> 跳跃</span><span class="desktop-only"><kbd>C</kbd> 下蹲</span><span class="desktop-only"><kbd>R</kbd> 回头</span></footer></section>
<div id="opening" hidden><span><kbd>空格</kbd> 跳过开场</span><button class="touch-button mobile-only open-skip" id="touch-skip">跳过开场</button></div>
<section id="hud" hidden><div class="mission"><small id="sector">沉井回廊</small><b><span id="meter">0 米</span> <span class="coin-stat">◆ <span id="score">0</span></span></b></div><div class="pressure"><small>追兵距离 <b id="gap">18 米</b></small><div><i id="pressure-bar"></i></div></div><div class="reticle"></div><div id="hint"></div><div class="time"><span id="clock">00:00</span><button id="hud-pause" aria-label="暂停">Ⅱ</button></div><div id="touch-controls" aria-label="触屏操作"><div class="touch-cluster"><button class="touch-button" id="touch-back" aria-label="按住回头" aria-pressed="false">回头</button><button class="touch-button" id="touch-sprint" aria-label="按住疾跑" aria-pressed="false">疾跑</button></div><div class="touch-cluster" id="touch-turns" hidden><button class="touch-button turn" id="touch-left" aria-pressed="false">↰ 左转</button><button class="touch-button turn" id="touch-right" aria-pressed="false">↱ 右转</button></div><div class="touch-cluster"><button class="touch-button" id="touch-duck" aria-label="按住下蹲" aria-pressed="false">下蹲</button><button class="touch-button" id="touch-jump">跳跃</button></div></div></section>
<section id="modal" class="overlay" hidden><div class="panel"><p class="eyebrow" id="modal-kicker"></p><h2 id="modal-title"></h2><p id="modal-body"></p><div id="options" hidden><label>画质 <select id="quality"><option value="high">高</option><option value="balanced">均衡</option><option value="low">流畅</option></select></label><label>鼠标灵敏度 <input id="sensitivity" type="range" min=".6" max="2" step=".1" value="1"></label><label>声音 <input id="sound" type="checkbox" checked></label><label>镜头晃动 <input id="shake" type="checkbox" checked></label></div><button class="primary" id="action"></button><button class="secondary" id="back">返回主菜单</button></div></section>
</main><script src="vendor/three.min.js"></script><script src="assets/textures.js"></script><script src="world.js"></script><script src="endless.js"></script><script src="game.js"></script></body></html>
